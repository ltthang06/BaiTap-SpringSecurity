<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm User' : 'Sửa User'})}">
</head>

<body>

<div th:replace="~{layouts/layout :: page(~{::main})}">

    <main>

        <div class="form-card">

            <h1 th:text="${mode == 'create' ? 'Thêm User' : 'Sửa User'}">
            </h1>

            <form th:object="${userDTO}"
                  method="post"
                  accept-charset="UTF-8"
                  th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}">

                <input type="hidden"
                       th:field="*{id}">

                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert error">

                    <p th:each="e : ${#fields.globalErrors()}"
                       th:text="${e}">
                    </p>

                </div>

                <label for="username">
                    Username
                </label>

                <input id="username"
                       type="text"
                       th:field="*{username}"
                       required>

                <small class="error-text"
                       th:errors="*{username}">
                </small>

                <label for="email">
                    Email
                </label>

                <input id="email"
                       type="email"
                       th:field="*{email}"
                       required>

                <small class="error-text"
                       th:errors="*{email}">
                </small>

                <label for="fullName">
                    Họ tên
                </label>

                <input id="fullName"
                       type="text"
                       th:field="*{fullName}"
                       required>

                <small class="error-text"
                       th:errors="*{fullName}">
                </small>

                <label for="roleName">
                    Role
                </label>

                <select id="roleName"
                        th:field="*{roleName}">

                    <option value="ROLE_USER">
                        USER
                    </option>

                    <option value="ROLE_ADMIN">
                        ADMIN
                    </option>

                </select>

                <label class="checkbox-row">

                    <input type="checkbox"
                           th:field="*{enabled}">

                    Enabled

                </label>

                <div class="actions">

                    <button type="submit"
                            class="button">
                        Lưu
                    </button>

                    <a class="button secondary"
                       th:href="@{/users}">
                        Hủy
                    </a>

                </div>

            </form>

            <p th:if="${mode == 'create'}"
               class="note">

                Mật khẩu mặc định của user do Admin tạo:
                <b>123456</b>.

            </p>

        </div>

    </main>

</div>

</body>
</html>
