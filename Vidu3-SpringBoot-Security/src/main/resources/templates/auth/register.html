<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace=
      "~{layouts/layout :: head('Đăng ký')}">
</head>

<body>

<div class="auth-page">

<div class="auth-card">

<h1>Đăng ký</h1>

<form th:action="@{/register}"
      th:object="${registerDTO}"
      method="post">

    <div th:if="${#fields.hasGlobalErrors()}"
         class="alert error">

        <p th:each="e : ${#fields.globalErrors()}"
           th:text="${e}">
        </p>

    </div>

    <label>Username</label>

    <input th:field="*{username}">

    <small class="error-text"
           th:errors="*{username}">
    </small>

    <label>Email</label>

    <input type="email"
           th:field="*{email}">

    <small class="error-text"
           th:errors="*{email}">
    </small>

    <label>Họ tên</label>

    <input th:field="*{fullName}">

    <label>Password</label>

    <input type="password"
           th:field="*{password}">

    <label>Confirm Password</label>

    <input type="password"
           th:field="*{confirmPassword}">

    <button class="button full">
        Đăng ký & nhận OTP
    </button>

</form>

</div>
</div>

</body>
</html>
