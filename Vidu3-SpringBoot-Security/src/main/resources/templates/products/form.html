<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm Product' : 'Sửa Product'})}">
</head>

<body>

<div th:replace="~{layouts/layout :: page(~{::main})}">

    <main>

        <div class="form-card">

            <h1 th:text="${mode == 'create' ? 'Thêm Product' : 'Sửa Product'}">
            </h1>

            <form th:object="${productDTO}"
                  method="post"
                  enctype="multipart/form-data"
                  accept-charset="UTF-8"
                  th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}">

                <input type="hidden"
                       th:field="*{id}">

                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert error">

                    <p th:each="e : ${#fields.globalErrors()}"
                       th:text="${e}">
                    </p>

                </div>

                <label for="name">
                    Tên sản phẩm
                </label>

                <input id="name"
                       type="text"
                       th:field="*{name}"
                       required>

                <small class="error-text"
                       th:errors="*{name}">
                </small>

                <label for="description">
                    Mô tả
                </label>

                <textarea id="description"
                          rows="5"
                          th:field="*{description}">
                </textarea>

                <label for="price">
                    Giá
                </label>

                <input id="price"
                       type="number"
                       step="1000"
                       min="0"
                       th:field="*{price}"
                       placeholder="Ví dụ: 180000"
                       required>

                <small class="error-text"
                       th:errors="*{price}">
                </small>

                <label for="image">
                    Ảnh sản phẩm
                </label>

                <input id="image"
                       type="file"
                       name="image"
                       accept="image/*">

                <div th:if="${productDTO.imageUrl != null and !#strings.isEmpty(productDTO.imageUrl)}">

                    <p>Ảnh hiện tại:</p>

                    <img th:src="${#strings.substringBefore(productDTO.imageUrl, '|')}"
                         class="preview"
                         alt="Current product image">

                </div>

                <div class="actions">

                    <button type="submit"
                            class="button">
                        Lưu
                    </button>

                    <a class="button secondary"
                       th:href="@{/products}">
                        Hủy
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
