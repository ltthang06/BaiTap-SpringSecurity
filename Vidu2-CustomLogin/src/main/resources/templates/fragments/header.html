<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="header">

    <nav style="
        display:flex;
        align-items:center;
        gap:16px;
        padding:15px 30px;
        background:#172554;
        color:white;
    ">

        <a th:href="@{/}"
           style="color:white;
                  text-decoration:none;
                  font-weight:bold;
                  margin-right:auto;">
            UTEShop
        </a>

        <div th:if=
             "${#authorization.expression('isAuthenticated()')}"
             style="display:flex;
                    align-items:center;
                    gap:12px;">

            <img
                th:src="${
                    #authentication.principal.images != null
                    and
                    !#strings.isEmpty(
                        #authentication.principal.images
                    )
                    ?
                    #authentication.principal.images
                    :
                    '/images/avatar-default.png'
                }"
                alt="Avatar"
                width="40"
                height="40"
                style="
                    border-radius:50%;
                    object-fit:cover;
                ">

            <strong
                th:text=
                "${#authentication.principal.fullName}">
                Nguyễn Văn A
            </strong>

            <span
                th:text=
                "'(' + ${#authentication.principal.username} + ')'">
                (user01)
            </span>

            <span
                th:text=
                "${#authentication.principal.email}">
                email@gmail.com
            </span>

            <span
                th:text=
                "${#authentication.principal.role}">
                ROLE_USER
            </span>

            <form th:action="@{/logout}"
                  method="post"
                  style="display:inline">

                <button type="submit">
                    Đăng xuất
                </button>

            </form>

        </div>

    </nav>

</header>

</body>
</html>
