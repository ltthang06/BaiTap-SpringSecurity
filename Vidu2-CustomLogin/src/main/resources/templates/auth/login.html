<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .login-box {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,.1);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 7px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 11px;
            border: 0;
            background: #2563eb;
            color: white;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Đăng nhập</h2>

    <div th:if="${param.error}">
        <p style="color:red">
            Username/email hoặc password không đúng
        </p>
    </div>

    <div th:if="${param.logout}">
        <p style="color:green">
            Bạn đã đăng xuất
        </p>
    </div>

    <form th:action="@{/login}"
          method="post">

        <label>
            Username hoặc Email
        </label>

        <input
            type="text"
            name="username"
            placeholder="Username hoặc email"
            required>

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Đăng nhập
        </button>

    </form>

</div>

</body>
</html>
